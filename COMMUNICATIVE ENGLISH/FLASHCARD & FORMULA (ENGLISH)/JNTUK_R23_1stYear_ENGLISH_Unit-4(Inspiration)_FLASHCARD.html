<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit IV English Flashcards</title>
<style>
  :root {
    --navy: #1A2A4A; --royal: #2C4A8C; --teal: #1E7A8C;
    --gold: #D4A017; --light-gold: #FFF8E7; --light-blue: #EAF0FB;
    --front-bg: #1A3A5C; --back-bg: #F0F7FF; --white: #fff;
    --grey: #444; --green: #186A3B; --purple: #6C3483;
    --brown: #784212; --dark-blue: #1A5276;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, Arial, sans-serif; background: #f0f4f8; color: var(--grey); }

  /* ── Cover ── */
  #cover {
    min-height: 100vh; background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px; position: relative; overflow: hidden;
  }
  #cover::before {
    content: ''; position: absolute; top: 0; left: 0; width: 8px; height: 100%; background: var(--teal);
  }
  #cover::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--gold);
  }
  .cover-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: var(--gold);
  }
  .cover-badge {
    background: #243B60; border-radius: 8px; padding: 8px 24px; margin-bottom: 24px;
    color: var(--gold); font-weight: bold; font-size: 13px;
  }
  .cover-badge span { display: block; color: #9AB8D8; font-size: 11px; font-weight: normal; margin-top: 2px; }
  .cover-title { font-size: clamp(48px, 10vw, 80px); font-weight: 900; line-height: 1; }
  .cover-title .flash { color: var(--white); }
  .cover-title .cards { color: var(--gold); }
  .cover-sub { color: #BDD4F5; font-size: 15px; margin: 12px 0 24px; }
  .cover-unit-box {
    background: var(--teal); border-radius: 8px; padding: 10px 32px;
    color: var(--white); font-weight: bold; font-size: 14px; margin-bottom: 16px;
  }
  .cover-lesson-box {
    background: var(--light-gold); border-radius: 6px; padding: 8px 24px;
    color: var(--navy); font-weight: bold; font-size: 12px; margin-bottom: 32px;
  }
  .cover-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 32px; }
  .cover-tag {
    background: #1E3A60; color: #9AB8D8; font-size: 10px;
    padding: 4px 10px; border-radius: 4px;
  }
  .start-btn {
    background: var(--gold); color: var(--navy); font-weight: bold;
    font-size: 16px; padding: 14px 40px; border: none; border-radius: 8px;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,160,23,.4); }

  /* ── Nav ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--navy); padding: 0 16px;
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  nav::-webkit-scrollbar { height: 3px; }
  nav::-webkit-scrollbar-thumb { background: var(--gold); }
  .nav-btn {
    background: none; border: none; color: #BDD4F5;
    font-size: 11px; padding: 14px 10px; cursor: pointer;
    white-space: nowrap; border-bottom: 3px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .nav-btn:hover, .nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── Main ── */
  main { display: none; }

  /* ── Section Banner ── */
  .section-banner {
    display: flex; align-items: center; gap: 12px;
    border-radius: 8px; padding: 16px 24px; margin: 24px 16px 16px;
    position: relative; overflow: hidden;
  }
  .section-banner::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--gold);
  }
  .section-banner-icon { font-size: 22px; }
  .section-banner h2 { color: var(--white); font-size: 16px; font-weight: bold; }

  /* ── Cards Grid ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px; padding: 0 16px 24px;
  }

  /* ── Flashcard ── */
  .flashcard { perspective: 1000px; height: 220px; cursor: pointer; }
  .flashcard-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .5s ease;
  }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
  }
  .flashcard-front {
    background: var(--front-bg);
    align-items: center; justify-content: center; text-align: center;
    padding: 20px;
  }
  .flashcard-front .card-label {
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px; border-radius: 10px 10px 0 0;
  }
  .flashcard-front h3 { color: var(--white); font-size: 13px; line-height: 1.5; }
  .flip-hint {
    position: absolute; bottom: 10px; right: 12px;
    color: rgba(255,255,255,.4); font-size: 10px;
  }
  .flashcard-back {
    background: var(--back-bg);
    transform: rotateY(180deg);
    padding: 14px 16px; overflow-y: auto;
  }
  .flashcard-back .card-label {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    border-radius: 10px 10px 0 0;
  }
  .flashcard-back .back-content { font-size: 11.5px; line-height: 1.65; color: var(--navy); }
  .flashcard-back .back-content b { color: var(--navy); }

  /* ── Section pages ── */
  .section-page { display: none; }
  .section-page.active { display: block; }

  /* ── Checklist ── */
  .checklist-wrap { padding: 0 16px 32px; }
  .checklist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .checklist-table th {
    background: var(--navy); color: var(--white);
    padding: 10px 12px; text-align: left;
  }
  .checklist-table td { padding: 10px 12px; border-bottom: 1px solid #ddd; }
  .checklist-table tr:nth-child(even) td { background: var(--light-blue); }
  .checklist-table input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--teal); }

  .footer-card {
    margin: 0 16px 32px;
    background: var(--light-gold); border: 2px solid var(--gold);
    border-radius: 10px; padding: 20px; text-align: center;
    font-size: 13px; line-height: 1.7; color: var(--navy);
  }

  @media (max-width: 500px) {
    .cards-grid { grid-template-columns: 1fr; }
    .flashcard { height: 200px; }
  }
</style>
</head>

       "<b>Present Simple</b> → Past Simple<br>'I work here.' → He said he <b>worked</b> there.<br><b>Present Continuous</b> → Past Continuous<br>'I am reading.' → She said she <b>was reading</b>.<br><b>Past Simple</b> → Past Perfect<br>'I left.' → He said he <b>had left</b>.<br><b>Will</b>→Would | <b>Can</b>→Could | <b>May</b>→Might"],

      ["PASSIVE VOICE\nTense-Wise Forms",

const CHECKLIST = [
  ["🎭 Prose",      "Author, Summary, 3 Themes, 2 Quotes, Moral"],
  ["🎧 Listening",  "Prediction strategy, transactional dialogues, 5 tips"],
  ["🗣️ Speaking",   "Formal phrases, informal tone, role-play structure"],
  ["📖 Reading",    "Trends/patterns/processes, data interpretation, key verbs"],
  ["✍️ Writing",    "Letter format (block style), Resume 7 sections, DOs/DON'Ts"],
  ["🧠 Grammar",    "Reporting verbs, D→I rules, tense shifts, passive formula"],
  ["📘 Vocabulary", "6+ confused word pairs, jargon definitions, examples"],
];

function buildSections() {
  SECTIONS.forEach((sec, i) => {
    const el = document.getElementById('sec' + i);
    const banner = `<div class="section-banner" style="background:${sec.color}">
      <span class="section-banner-icon">${sec.icon}</span>
      <h2>${sec.title}</h2>
    </div>`;
    const grid = '<div class="cards-grid">' +
      sec.cards.map((c, j) => makeCard(c[0], c[1], sec.color, i, j)).join('') +
    '</div>';
    el.innerHTML = banner + grid;
  });

  // Checklist
  const cl = document.getElementById('sec7');
  cl.innerHTML = `
    <div class="section-banner" style="background:var(--navy)">
      <span class="section-banner-icon">✅</span>
      <h2>LAST-MINUTE QUICK REVISION CHECKLIST</h2>
    </div>
    <div class="checklist-wrap">
      <table class="checklist-table">
        <thead><tr><th>Section</th><th>Must-Know Points</th><th style="text-align:center">Done?</th></tr></thead>
        <tbody>
          ${CHECKLIST.map(r => `<tr>
            <td><b>${r[0]}</b></td>
            <td>${r[1]}</td>
            <td style="text-align:center"><input type="checkbox" onchange="this.closest('tr').style.opacity=this.checked?'.5':'1'"></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="footer-card" style="margin-top:24px">
        <b>All the Best for Your Exams! 🎓</b><br>
        Remember: Read the question carefully, answer precisely, and manage your time well.<br>
        <em>"Success is the sum of small efforts, repeated day in and day out."</em>
      </div>
    </div>`;
}

function makeCard(front, back, color, si, ci) {
  const id = `card-${si}-${ci}`;
  const frontLines = front.split('\n').map((l,i) => i===0 ? `<b>${l}</b>` : `<small style="color:rgba(255,255,255,.7);font-size:10px">${l}</small>`).join('<br>');
  return `
    <div class="flashcard" id="${id}" onclick="flip('${id}')">
      <div class="flashcard-inner">
        <div class="flashcard-front">
          <div class="card-label" style="background:${color}"></div>
          <h3>${frontLines}</h3>
          <span class="flip-hint">tap to flip ↩</span>
        </div>
        <div class="flashcard-back">
          <div class="card-label" style="background:${color}"></div>
          <div class="back-content" style="margin-top:8px">${back}</div>
        </div>
      </div>
    </div>`;
}

function flip(id) {
  document.getElementById(id).classList.toggle('flipped');
}

function showSection(idx, btn) {
  document.querySelectorAll('.section-page').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec' + idx).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function startApp() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  buildSections();
}
</script>
